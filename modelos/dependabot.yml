# Copie para .github/dependabot.yml no seu projeto
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14   # só sugere versões publicadas há 2 semanas ou mais
    groups:
      seguras:
        update-types: [minor, patch]
    ignore:
      # versões principais (ex.: Vite 5 -> 7) só quando decidir migrar
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

# CodeQL (reutilizável). Grátis em repositório PÚBLICO; em privado exige GitHub Advanced Security.
# Fica separado da verificação padrão porque precisa de 'security-events: write'.
# Uso:
#   jobs:
#     codeql:
#       uses: otaviohc19/ci-padrao/.github/workflows/codeql.yml@v1
#       permissions:
#         contents: read
#         security-events: write
name: CodeQL

on:
  workflow_call:
    inputs:
      linguagens:
        description: Linguagens analisadas (separadas por vírgula)
        type: string
        default: javascript-typescript

permissions:
  contents: read

jobs:
  codeql:
    name: Análise estática (CodeQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ inputs.linguagens }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

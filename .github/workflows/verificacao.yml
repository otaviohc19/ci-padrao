# Verificação padrão para projetos JavaScript/Node (reutilizável).
# Uso em outro repositório:
#   jobs:
#     verificacao:
#       uses: otaviohc19/ci-padrao/.github/workflows/verificacao.yml@v1
name: Verificação padrão

on:
  workflow_call:
    inputs:
      node-version:
        description: Versão do Node
        type: string
        default: '22'
      diretorio:
        description: Pasta do projeto (onde fica o package.json)
        type: string
        default: '.'
      build:
        description: Rodar npm run build
        type: boolean
        default: true
      build-env:
        description: Linhas CHAVE=valor gravadas no .env antes do build (só valores públicos)
        type: string
        default: ''
      nivel-auditoria:
        description: Nível mínimo que reprova no npm audit (low, moderate, high, critical)
        type: string
        default: high
      sast:
        description: Análise estática com Semgrep (funciona em repositório privado)
        type: boolean
        default: true
      codeql:
        description: CodeQL (grátis só em repositório público)
        type: boolean
        default: false
      lighthouse:
        description: Lighthouse em cima da pasta gerada pelo build (sites)
        type: boolean
        default: false
      pasta-build:
        description: Pasta gerada pelo build, para o Lighthouse
        type: string
        default: dist

permissions:
  contents: read

env:
  GITLEAKS_VERSAO: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_VERSAO: 1.179.0

jobs:
  segredos:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks (com checksum)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Procurar segredos em todo o histórico
        run: ./gitleaks git --redact --no-banner --verbose .

  qualidade:
    name: Instalação, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.diretorio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.diretorio }}/package-lock.json
      - name: Instalar dependências (exatamente as do lockfile)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint --if-present
      - name: Testes
        run: npm test --if-present
      - name: Build
        if: inputs.build
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          if [ -n "$BUILD_ENV" ]; then printf '%s\n' "$BUILD_ENV" > .env; fi
          npm run build
      - name: Guardar o build para o Lighthouse
        if: inputs.build && inputs.lighthouse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: ${{ inputs.diretorio }}/${{ inputs.pasta-build }}
          retention-days: 1

  dependencias:
    name: Dependências vulneráveis (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.diretorio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=${{ inputs.nivel-auditoria }}

  sast:
    name: Análise estática (Semgrep)
    if: inputs.sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep
        run: |
          pipx run "semgrep==${SEMGREP_VERSAO}" scan \
            --config p/javascript --config p/react --config p/secrets --config p/owasp-top-ten \
            --severity ERROR --severity WARNING \
            --metrics off --error --exclude node_modules --exclude dist \
            ${{ inputs.diretorio }}

  codeql:
    name: Análise estática (CodeQL)
    if: inputs.codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  lighthouse:
    name: Lighthouse
    if: inputs.build && inputs.lighthouse
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: site
      - name: Metas mínimas
        run: |
          cat > lighthouserc.json <<'JSON'
          {
            "ci": {
              "assert": {
                "assertions": {
                  "categories:accessibility": ["error", { "minScore": 0.9 }],
                  "categories:best-practices": ["error", { "minScore": 0.9 }],
                  "categories:seo": ["warn", { "minScore": 0.8 }],
                  "categories:performance": ["warn", { "minScore": 0.7 }]
                }
              }
            }
          }
          JSON
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          staticDistDir: site
          configPath: lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false
